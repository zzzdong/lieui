[package]
name = "lieui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "简易 GUI 库：retained 视图树 + R1 响应式 + 纯 CPU 渲染"

[dependencies]
lieui-geom = { workspace = true }
lieui-text = { workspace = true }
lieui-layout = { workspace = true }
parley = { workspace = true }
# 纯 CPU 光栅化（设计 §3.8）。注意：根 crate 用 0.1，这里用 0.2（本地 registry 里有 0.2.0）。
vello_cpu = "0.2"

# 窗口层（M4）。设为可选：核心（保留树 / 布局 / 命中 / 光栅化）不依赖窗口系统，
# 因此可以 `--no-default-features` 做完全无头编译与单测。
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
# 系统剪贴板（Ctrl+C/X/V）—— 归平台层，核心不依赖它
arboard = { version = "3", optional = true }

[features]
default = ["winit"]
winit = ["dep:winit", "dep:softbuffer", "dep:arboard"]
