[package]
name = "lieui"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zzzdong/lieui"
description = "简易 GUI 库：retained 视图树 + R1 响应式 + 纯 CPU 渲染"

# 根 crate 即主 crate（lieui）；支撑 crate 以 path 依赖放在 crates/ 下
[workspace]
resolver = "2"
members = ["crates/lieui-geom", "crates/lieui-text", "crates/lieui-layout"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zzzdong/lieui"

[workspace.dependencies]
lieui-geom = { path = "crates/lieui-geom" }
lieui-text = { path = "crates/lieui-text" }
lieui-layout = { path = "crates/lieui-layout" }
parley = "0.11.0"

[dependencies]
lieui-geom = { workspace = true }
lieui-text = { workspace = true }
lieui-layout = { workspace = true }
parley = { workspace = true }
vello_cpu = "0.2"

winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
arboard = { version = "3", optional = true }

[features]
default = ["winit"]
winit = ["dep:winit", "dep:softbuffer", "dep:arboard"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
