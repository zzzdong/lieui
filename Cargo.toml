[package]
name = "lieui"
version = "0.2.0"
edition = "2021"
description = "A Rust GUI library with C/S architecture and builder-driven UI"

[dependencies]
log = "0.4"
vello_cpu = "0.0.9"
kurbo = "0.13.1"
parley = "0.11.0"
slotmap = "1.0"
winit = "0.30"
softbuffer = "0.4"

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "counter"
path = "examples/counter.rs"

[[example]]
name = "pdfkit"
path = "examples/pdfkit.rs"

[[example]]
name = "window"
path = "examples/window.rs"
