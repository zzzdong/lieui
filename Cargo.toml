[workspace]
resolver = "2"
members = [
    "crates/lieui-geom",
    "crates/lieui-text",
    "crates/lieui-layout",
    "crates/lieui",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zzzdong/lieui"

[workspace.dependencies]
lieui-geom = { path = "crates/lieui-geom" }
lieui-text = { path = "crates/lieui-text" }
lieui-layout = { path = "crates/lieui-layout" }
parley = "0.11.0"

# 与根 crate 保持一致（debug 下 vello/parley 太慢时会看不出真实性能）
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
