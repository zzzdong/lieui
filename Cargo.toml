[package]
name = "lieui"
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zzzdong/lieui"
readme = "README.md"
description = "A retained-tree GUI toolkit in pure Rust: retained view tree + reactive signals + pure-CPU rendering"
keywords = ["gui", "ui", "widgets", "layout", "text"]
categories = ["gui"]
# 打包只带源码与示例；开发文档留在仓库里（图标字体在 src/assets/ 内嵌随包发布）
exclude = ["/docs"]

[workspace]
resolver = "2"
members = ["crates/lieui-geom", "crates/lieui-text", "crates/lieui-layout"]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zzzdong/lieui"

[workspace.dependencies]
# path + version 双写：发布时 crates.io 按版本解析，本地按 path 解析
lieui-geom = { path = "crates/lieui-geom", version = "0.1.0-alpha.4" }
lieui-text = { path = "crates/lieui-text", version = "0.1.0-alpha.4" }
lieui-layout = { path = "crates/lieui-layout", version = "0.1.0-alpha.4" }
parley = "0.11"

# ── lint 门禁（S0 / refactor-plan 主线 H1）──
# 单一真源，各成员 crate 用 `[lints] workspace = true` 继承（不随 workspace 自动继承，须显式声明）。
[workspace.lints.rust]
unexpected_cfgs = "deny"

[workspace.lints.clippy]
# 只开 `all`（不含 pedantic / nursery / cargo）：实测全库 12 处 clippy 建议全部落在
# `all` 级别且已清零；pedantic 会一次性引入上百条风格噪声，不适合作为增量门禁。
# 后续要收紧时，建议单独开一个批次逐条评估，而不是一次全开。
all = "deny"

[dependencies]
lieui-geom = { workspace = true }
lieui-text = { workspace = true }
lieui-layout = { workspace = true }
parley = { workspace = true }
vello_cpu = "0.3"

# 平台层（窗口 / 软渲染上屏 / 剪贴板）：关掉 default 特性即纯库形态，
# 可自选 winit / 其他宿主接入
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
arboard = { version = "3", optional = true }

[features]
default = ["winit"]
winit = ["dep:winit", "dep:softbuffer", "dep:arboard"]

[lints]
workspace = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
