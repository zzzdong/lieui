[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["zzzdong <kuwater@163.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zzzdong/lieui"
homepage = "https://github.com/zzzdong/lieui"

[workspace.dependencies]
lieui-core   = { path = "crates/lieui-core",   version = "0.1.0" }
lieui-layout = { path = "crates/lieui-layout", version = "0.1.0" }
lieui-text   = { path = "crates/lieui-text",   version = "0.1.0" }
lieui        = { path = "crates/lieui",        version = "0.1.0" }

bitflags = "2.6"
parley   = "0.11"
ron      = "0.8"

# ── 编译速度：dev 下保留基本优化，依赖全量优化 ──
[profile.dev]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
