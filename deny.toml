# 依赖审计策略（cargo-deny）
#
# 守的是一条真实教训：9b00f0a 曾把 skrifa 对齐到 parley 用的 0.44，
# 之前树里存在两份字体引擎，导致"按墨迹盒居中"（tooltip / loading 遮罩 / 图标对齐）偏掉几个百分点。
# bans 段是防止这类"悄悄多一份"复发的第一道闸。
#
# 注意：本文件按**各版本 cargo-deny 的公共子集**书写（本机装的是旧版，CI 用
# taiki-e/install-action 装最新版）。因此不使用 v2 才有的字段
# （`version` / `yanked` / `wildcards` / `git` / `multiple-versions-include-dev`）。
# 想启用通配符与 git 依赖禁令时，请在确认 CI 的 cargo-deny 版本后再加。

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
# 有漏洞时报告但不阻断构建（配合 PR review 判断），避免 advisory-db 误报卡住开发。
ignore = []

[licenses]
# 本项目对外承诺 MIT OR Apache-2.0，依赖必须落在同一双许可内。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    # arboard 的 Windows 剪贴板后端链路（clipboard-win / error-code）用BSL-1.0。
    # BSL-1.0 是 OSI 批准的 permissive 许可，与 MIT OR Apache-2.0 可并存。
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
# 先 warn：当前树里确有若干传递重复（bitflags / bytemuck 等）。
# 收紧到 "deny" 之前需逐条确认能否用 skip 精确豁免 —— 目标是把
# "同一语义出现两份实现"（如两份字体引擎）从"没人注意"变成"构建失败"。
multiple-versions = "warn"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]